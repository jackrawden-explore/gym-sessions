<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#14130F">
<title>Gym sessions</title>
<style>
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body {
  margin: 0; background: #14130F; color: #F2EFE6;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
  font-size: 16px; line-height: 1.5;
  padding: 14px 14px calc(28px + env(safe-area-inset-bottom));
  max-width: 560px; margin-left: auto; margin-right: auto;
}
a { color: #E8A33D; }
select {
  font-family: inherit; font-size: 17px; color: #F2EFE6; width: 100%;
  background: #1D1B16; border: 1px solid #2C2924; border-radius: 12px;
  height: 52px; padding: 0 14px; appearance: none; -webkit-appearance: none;
  background-image: linear-gradient(45deg, transparent 50%, #8E8A7E 50%), linear-gradient(135deg, #8E8A7E 50%, transparent 50%);
  background-position: calc(100% - 20px) 23px, calc(100% - 14px) 23px;
  background-size: 6px 6px, 6px 6px; background-repeat: no-repeat;
}
.tagline { font-size: 13px; color: #8E8A7E; margin: 8px 2px 14px; }

.card { background: #1D1B16; border-radius: 16px; padding: 20px 16px 18px; }
.card.rest { background: #16201B; }
.round { font-size: 13px; color: #8E8A7E; }
.where { font-size: 25px; margin: 2px 0 12px; color: #E8A33D; }
.card.rest .where { color: #7FC79B; }
.clock { font-size: 78px; font-weight: 500; line-height: 0.95; margin: 0; letter-spacing: -0.03em; }
.clock.hot { color: #E8A33D; }
.card.rest .clock.hot { color: #7FC79B; }
.track { height: 3px; background: #2C2924; border-radius: 2px; margin-top: 16px; overflow: hidden; }
.track b { display: block; height: 100%; width: 0; background: #E8A33D; }
.meta { font-size: 12px; color: #8E8A7E; display: flex; justify-content: space-between; margin-top: 12px; }

.moves { margin-top: 14px; }
.move { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-top: 1px solid #2C2924; }
.move svg { flex: 0 0 92px; width: 92px; height: 66px; color: #CFC9B8; }
.move .txt { font-size: 15px; min-width: 0; }
.move .qty { color: #E8A33D; }
.move .how { display: block; font-size: 12px; color: #8E8A7E; text-decoration: none; margin-top: 2px; }
.plainline { padding: 9px 0; border-top: 1px solid #2C2924; font-size: 15px; }
.card.rest .plainline { border-top-color: #24332B; }
.nextup { padding: 9px 0; border-top: 1px solid #24332B; font-size: 15px; color: #7FC79B; }

button {
  font-family: inherit; font-size: 16px; color: #F2EFE6;
  background: #1D1B16; border: 1px solid #2C2924; border-radius: 12px;
  height: 52px; width: 100%; margin-top: 8px;
}
button:active { transform: scale(0.985); }
#go { background: #E8A33D; color: #14130F; border: 0; font-weight: 600; height: 58px; font-size: 18px; }
.two { display: flex; gap: 8px; }
button.ghost { height: 40px; font-size: 14px; color: #8E8A7E; margin-top: 14px; }
.awake { margin-top: 12px; font-size: 13px; color: #8E8A7E; }
.awake.on { color: #8FC24A; }

#rate { display: none; margin-top: 14px; background: #1D1B16; border-radius: 14px; padding: 14px; }
#rate p { margin: 0 0 10px; font-size: 15px; }
#rate .btns { display: flex; gap: 6px; }
#rate .btns button { margin-top: 0; height: 48px; }
.saved { font-size: 15px; color: #8FC24A; }
.saved.warn { color: #E8A33D; }

h2 { font-size: 14px; font-weight: 400; color: #8E8A7E; margin: 26px 0 6px; }
.row { display: flex; justify-content: space-between; gap: 12px; padding: 9px 12px; border-radius: 10px; font-size: 15px; }
.row.now { background: #1D1B16; color: #E8A33D; }
.row.past { color: #8E8A7E; }
.row.brk { font-size: 13px; color: #6E6A60; padding: 5px 12px; }
.row.brk.now { background: #16201B; color: #7FC79B; }
.sub { font-size: 12px; color: #8E8A7E; }
.hrow { display: flex; justify-content: space-between; gap: 12px; padding: 10px 12px; border-radius: 10px; font-size: 15px; background: #1D1B16; margin-bottom: 6px; }
.hn { color: #E8A33D; }
.empty { font-size: 14px; color: #6E6A60; padding: 8px 2px; }
.backup textarea {
  display: none; width: 100%; margin-top: 8px; font-family: ui-monospace, Menlo, Consolas, monospace;
  font-size: 12px; color: #F2EFE6; background: #1D1B16; border: 1px solid #2C2924;
  border-radius: 12px; padding: 10px; resize: vertical;
}
#restorewrap { display: none; }
#restorewrap textarea { display: block; }
.backup p { margin: 10px 2px 0; }
.sync { font-size: 14px; color: #8E8A7E; margin: 0 2px; }
.sync.ok { color: #8FC24A; }
.sync.warn { color: #E8A33D; }
@media (prefers-reduced-motion: reduce) { animate { display: none; } }
</style>
</head>
<body>

<select id="picker" aria-label="Choose a session"></select>
<div class="tagline" id="tagline"></div>

<div class="card" id="card">
  <div class="round" id="round">Ready</div>
  <div class="where" id="where"></div>
  <p class="clock" id="clock">00:00</p>
  <div class="track"><b id="bar"></b></div>
  <div class="meta"><span id="gone">0:00 elapsed</span><span id="togo"></span></div>
  <div class="moves" id="moves"></div>
</div>

<button id="go">Start</button>
<div class="two">
  <button id="back">Previous</button>
  <button id="skip">Next block</button>
</div>
<button id="reset" style="height:44px">Reset</button>

<div id="rate">
  <p>How hard did that feel?</p>
  <div class="btns">
    <button data-r="1">1</button><button data-r="2">2</button><button data-r="3">3</button><button data-r="4">4</button><button data-r="5">5</button>
  </div>
</div>

<p class="awake" id="awake">Screen will stay awake once started.</p>

<h2>Session plan</h2>
<div id="plan"></div>

<h2 id="histhead">History</h2>
<div id="history"></div>

<h2>Sync</h2>
<p id="sync" class="sync">Checking the server…</p>
<button id="resync" class="ghost">Sync now</button>

<h2>Backup</h2>
<div class="backup">
  <div class="two">
    <button id="showbackup">Show backup code</button>
    <button id="showrestore">Restore</button>
  </div>
  <textarea id="backupbox" rows="3" readonly></textarea>
  <div id="restorewrap">
    <textarea id="restorebox" rows="3" placeholder="Paste a backup code here"></textarea>
    <button id="dorestore">Restore from code</button>
  </div>
  <p id="backupmsg" class="sub"></p>
</div>

function loop(s, h) { return h ? (s[0] + ";" + s[1] + ";" + s[1] + ";" + s[0]) : (s[0] + ";" + s[1] + ";" + s[0]); }
function kt(h) { return h ? "0;0.35;0.7;1" : "0;0.5;1"; }

function fig(o) {
  var dur = o.dur || "2.4s", hold = !!o.hold, k = kt(hold);
  var s = '<svg viewBox="0 0 100 72" xmlns="http://www.w3.org/2000/svg" ' +
    'stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none">';
  if (o.ground !== false) { s += '<line x1="4" y1="66" x2="96" y2="66" stroke-width="1.5" opacity="0.3"/>'; }
  if (o.deco) { s += o.deco; }
  if (o.head) {
    s += '<circle r="6" cx="' + o.head[0][0] + '" cy="' + o.head[0][1] + '">' +
      '<animate attributeName="cx" values="' + loop([o.head[0][0], o.head[1][0]], hold) + '" keyTimes="' + k + '" dur="' + dur + '" repeatCount="indefinite"/>' +
      '<animate attributeName="cy" values="' + loop([o.head[0][1], o.head[1][1]], hold) + '" keyTimes="' + k + '" dur="' + dur + '" repeatCount="indefinite"/></circle>';
  }
  for (var i = 0; i < o.paths.length; i++) {
    var p = o.paths[i], w = p[2] ? ' stroke-width="' + p[2] + '"' : '';
    s += '<path d="' + p[0] + '"' + w + '><animate attributeName="d" values="' + loop(p, hold) +
      '" keyTimes="' + k + '" dur="' + dur + '" repeatCount="indefinite"/></path>';
  }
  return s + '</svg>';
}

/* ---------- state ---------- */
var S = null, i = 0, left = 0, gone = 0, TOT = 0;
var on = false, t = null, ac = null, lock = null;
var LOG_KEY = "gymlog_v1";

function d(id) { return document.getElementById(id); }
function mm(s) { var m = Math.floor(s / 60), r = s % 60; return (m < 10 ? "0" : "") + m + ":" + (r < 10 ? "0" : "") + r; }
function ms(s) { var m = Math.floor(s / 60), r = s % 60; return m + ":" + (r < 10 ? "0" : "") + r; }
function esc(x) { return String(x).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }

/* ---------- history ---------- */
function readLog() {
  try { return JSON.parse(localStorage.getItem(LOG_KEY)) || {}; }
  catch (e) { return {}; }
}
function writeLog(o) {
  try { localStorage.setItem(LOG_KEY, JSON.stringify(o)); return true; }
  catch (e) { return false; }
}
function addEntry(id, rpe) {
  var l = readLog();
  if (!l[id]) { l[id] = []; }
  l[id].push({ d: new Date().toISOString().slice(0, 10), r: rpe });
  return writeLog(l);
}
function statsFor(id) {
  var l = readLog()[id] || [];
  if (!l.length) { return null; }
  var last = l[l.length - 1];
  var sum = 0, n = 0;
  for (var k = 0; k < l.length; k++) { if (l[k].r) { sum += l[k].r; n++; } }
  return { count: l.length, last: last.d, avg: n ? (sum / n).toFixed(1) : null };
}
function niceDate(iso) {
  var p = iso.split("-");
  var mn = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
  return parseInt(p[2], 10) + " " + mn[parseInt(p[1], 10) - 1];
}

/* ---------- picker ---------- */
function buildPicker() {
  var h = "";
  for (var k = 0; k < SESSIONS.length; k++) {
    var s = SESSIONS[k], st = statsFor(s.id);
    var suffix = st ? "  \u2713" + st.count : "";
    h += '<option value="' + s.id + '">' + esc(s.name) + " \u00b7 " + s.mins + "min" + suffix + "</option>";
  }
  d("picker").innerHTML = h;
}

function renderHistory() {
  var l = readLog(), rows = [], total = 0;
  for (var k = 0; k < SESSIONS.length; k++) {
    var s = SESSIONS[k], e = l[s.id];
    if (e && e.length) {
      total += e.length;
      var last = e[e.length - 1];
      rows.push({ name: s.name, n: e.length, date: last.d, rpe: last.r });
    }
  }
  if (!rows.length) {
    d("history").innerHTML = '<div class="empty">Nothing logged yet. Finish a session and it appears here.</div>';
    d("histhead").textContent = "History";
    return;
  }
  rows.sort(function (a, b) { return a.date < b.date ? 1 : -1; });
  var h = "";
  for (var j = 0; j < rows.length; j++) {
    var r = rows[j];
    h += '<div class="hrow"><div><div>' + esc(r.name) + '</div><div class="sub">last ' + niceDate(r.date) +
         (r.rpe ? " \u00b7 felt " + r.rpe + "/5" : "") + '</div></div><div class="hn">\u00d7' + r.n + '</div></div>';
  }
  h += '<button id="clearlog" class="ghost">Clear all history</button>';
  d("history").innerHTML = h;
  d("histhead").textContent = "History \u00b7 " + total + " session" + (total === 1 ? "" : "s") + " done";
  d("clearlog").onclick = function () {
    if (confirm("Delete all saved session history?")) {
      try { localStorage.removeItem(LOG_KEY); } catch (e) {}
      buildPicker(); renderHistory();
    }
  };
}

/* ---------- audio + wake ---------- */
function beep(f, len) {
  try {
    if (!ac) { ac = new (window.AudioContext || window.webkitAudioContext)(); }
    if (ac.state === "suspended") { ac.resume(); }
    var o = ac.createOscillator(), g = ac.createGain();
    o.connect(g); g.connect(ac.destination);
    o.type = "sine"; o.frequency.value = f;
    g.gain.setValueAtTime(0.3, ac.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + len);
    o.start(); o.stop(ac.currentTime + len);
  } catch (e) {}
}
function wake() {
  if (!("wakeLock" in navigator)) {
    d("awake").textContent = "This browser can't hold the screen on \u2014 set auto-lock to Never in your phone settings.";
    return;
  }
  navigator.wakeLock.request("screen").then(function (l) {
    lock = l;
    d("awake").textContent = "Screen locked awake.";
    d("awake").className = "awake on";
    l.addEventListener("release", function () { lock = null; });
  }).catch(function () {
    d("awake").textContent = "Screen lock refused \u2014 set auto-lock to Never instead.";
  });
}
function dropWake() {
  if (lock) { try { lock.release(); } catch (e) {} lock = null; }
}
document.addEventListener("visibilitychange", function () {
  if (document.visibilityState === "visible" && on && !lock) { wake(); }
});

/* ---------- render ---------- */
function drawMoves() {
  var b = S.blocks[i], h = "";
  if (b.moves) {
    for (var k = 0; k < b.moves.length; k++) {
      var m = b.moves[k];
      h += '<div class="move">' + (ART[m[2]] || "") +
        '<div class="txt"><span class="qty">' + esc(m[0]) + '</span> ' + esc(m[1]) +
        '<a class="how" href="' + yt(m[3]) + '" target="_blank" rel="noopener">Watch how &rsaquo;</a></div></div>';
    }
    if (b.note) { h += '<div class="plainline">' + esc(b.note) + '</div>'; }
  } else if (b.rest) {
    h = '<div class="nextup">Up next: ' + esc(b.next) + '</div>';
  } else {
    for (var j = 0; j < b.lines.length; j++) { h += '<div class="plainline">' + esc(b.lines[j]) + '</div>'; }
  }
  d("moves").innerHTML = h;
}

function drawPlan() {
  var h = "";
  for (var k = 0; k < S.blocks.length; k++) {
    var b = S.blocks[k], base = b.rest ? "row brk" : "row";
    var cls = k === i ? base + " now" : (k < i ? base + " past" : base);
    var sub = b.rest ? "" : '<div class="sub">' + esc(b.r) + "</div>";
    h += '<div class="' + cls + '"><div>' + esc(b.w) + sub + "</div><div>" + ms(b.s) + "</div></div>";
  }
  d("plan").innerHTML = h;
}

function draw() {
  var b = S.blocks[i];
  d("card").className = b.rest ? "card rest" : "card";
  d("round").textContent = b.r;
  d("where").textContent = b.w;
  d("clock").textContent = mm(left);
  d("clock").className = (left <= 10 && on) ? "clock hot" : "clock";
  d("bar").style.width = Math.round((gone / TOT) * 100) + "%";
  d("gone").textContent = ms(gone) + " elapsed";
  d("togo").textContent = ms(TOT - gone) + " to go";
}

/* ---------- flow ---------- */
function load(id) {
  for (var k = 0; k < SESSIONS.length; k++) { if (SESSIONS[k].id === id) { S = SESSIONS[k]; } }
  if (!S) { S = SESSIONS[0]; }
  TOT = 0;
  for (var j = 0; j < S.blocks.length; j++) { TOT += S.blocks[j].s; }
  on = false;
  if (t) { clearInterval(t); t = null; }
  dropWake();
  i = 0; left = S.blocks[0].s; gone = 0;
  d("go").textContent = "Start";
  d("rate").style.display = "none";
  d("awake").className = "awake";
  d("awake").textContent = "Screen will stay awake once started.";
  var st = statsFor(S.id);
  d("tagline").textContent = S.tag + " \u00b7 " + S.mins + " min" +
    (st ? " \u00b7 done " + st.count + "\u00d7, last " + niceDate(st.last) : " \u00b7 not done yet");
  drawPlan(); drawMoves(); draw();
}

function finish() {
  on = false;
  if (t) { clearInterval(t); t = null; }
  dropWake();
  d("go").textContent = "Start again";
  d("card").className = "card";
  d("round").textContent = "Session complete";
  d("where").textContent = S.name;
  d("clock").textContent = "00:00";
  d("moves").innerHTML = '<div class="plainline">Well done. Stretch what worked hardest.</div>';
  d("rate").style.display = "block";
  beep(660, 0.9);
}

function jump(n) {
  var next = i + n;
  if (next < 0) { return; }
  if (next >= S.blocks.length) { gone = TOT; draw(); finish(); return; }
  if (n > 0) { gone += left; }
  else { gone = gone - (S.blocks[i].s - left) - S.blocks[next].s; if (gone < 0) { gone = 0; } }
  i = next; left = S.blocks[i].s;
  beep(S.blocks[i].rest ? 520 : 880, 0.45);
  drawPlan(); drawMoves(); draw();
}

function step() {
  if (!on) { return; }
  left--; gone++;
  if (left === 3 || left === 2 || left === 1) { beep(660, 0.12); }
  if (left <= 0) {
    if (i >= S.blocks.length - 1) { draw(); finish(); return; }
    i++; left = S.blocks[i].s;
    beep(S.blocks[i].rest ? 520 : 880, 0.45);
    drawPlan(); drawMoves();
  }
  draw();
}

/* ---------- wiring ---------- */
d("picker").onchange = function () { load(this.value); };

d("go").onclick = function () {
  if (d("rate").style.display === "block") { load(S.id); return; }
  on = !on;
  this.textContent = on ? "Pause" : "Resume";
  if (on) { beep(880, 0.2); wake(); if (!t) { t = setInterval(step, 1000); } }
  else { dropWake(); d("awake").className = "awake"; d("awake").textContent = "Paused \u2014 screen may sleep."; }
  draw();
};
d("skip").onclick = function () { jump(1); };
d("back").onclick = function () { jump(-1); };
d("reset").onclick = function () { load(S.id); };

/* ---------- server sync ---------- */
var KEY_STORE = "gymkey_v1";
var syncState = "idle";

function authKey() { try { return localStorage.getItem(KEY_STORE) || ""; } catch (e) { return ""; } }
function setAuthKey(k) { try { localStorage.setItem(KEY_STORE, k); } catch (e) {} }

function setSync(msg, cls) {
  var el = d("sync");
  el.textContent = msg;
  el.className = "sync" + (cls ? " " + cls : "");
}

/* local store {id:[{d,r}]} <-> server list [{session,date,rpe}] */
function localToList() {
  var l = readLog(), out = [];
  for (var id in l) {
    if (!l.hasOwnProperty(id)) { continue; }
    for (var k = 0; k < l[id].length; k++) {
      out.push({ session: id, date: l[id][k].d, rpe: l[id][k].r });
    }
  }
  return out;
}
function listToLocalShape(list) {
  var o = {};
  for (var k = 0; k < list.length; k++) {
    var e = list[k];
    if (!e || !e.session || !e.date) { continue; }
    if (!o[e.session]) { o[e.session] = []; }
    o[e.session].push({ d: e.date, r: e.rpe });
  }
  return o;
}
function entryKey(e) { return e.session + "|" + e.date + "|" + e.rpe; }

function api(method, body, cb) {
  var x = new XMLHttpRequest();
  x.open(method, "/api/log", true);
  x.setRequestHeader("Content-Type", "application/json");
  var k = authKey();
  if (k) { x.setRequestHeader("x-gym-key", k); }
  x.timeout = 8000;
  x.onload = function () {
    if (x.status === 401) { return cb("auth"); }
    if (x.status < 200 || x.status >= 300) { return cb("http " + x.status); }
    try { cb(null, JSON.parse(x.responseText)); }
    catch (e) { cb("bad response"); }
  };
  x.onerror = function () { cb("offline"); };
  x.ontimeout = function () { cb("timeout"); };
  x.send(body ? JSON.stringify(body) : null);
}

function syncNow(quiet) {
  if (syncState === "busy") { return; }
  syncState = "busy";
  if (!quiet) { setSync("Syncing\u2026"); }
  api("GET", null, function (err, data) {
    if (err === "auth") {
      syncState = "idle";
      setSync("Log needs a key. Tap to enter it.", "warn");
      d("sync").onclick = askKey;
      return;
    }
    if (err) {
      syncState = "idle";
      setSync("Offline \u2014 saved on this phone, will sync later.", "warn");
      return;
    }
    var server = data.entries || [];
    /* pull server entries into local */
    mergeLog(listToLocalShape(server));
    /* push anything local that the server hasn't got */
    var have = {};
    for (var a = 0; a < server.length; a++) { have[entryKey(server[a])] = 1; }
    var push = [];
    var mine = localToList();
    for (var b = 0; b < mine.length; b++) {
      if (!have[entryKey(mine[b])]) { push.push(mine[b]); }
    }
    if (!push.length) {
      syncState = "idle";
      setSync("Synced \u00b7 " + server.length + " session" + (server.length === 1 ? "" : "s") + " on the server", "ok");
      buildPicker(); d("picker").value = S.id; renderHistory();
      return;
    }
    api("POST", push, function (e2, res) {
      syncState = "idle";
      if (e2) {
        setSync("Saved here, server push failed \u2014 will retry.", "warn");
      } else {
        var n = (res.entries || []).length;
        setSync("Synced \u00b7 " + n + " session" + (n === 1 ? "" : "s") + " on the server", "ok");
      }
      buildPicker(); d("picker").value = S.id; renderHistory();
    });
  });
}

function askKey() {
  var k = prompt("Enter the log key (GYM_KEY):", "");
  if (k === null) { return; }
  setAuthKey(k.trim());
  d("sync").onclick = null;
  syncNow();
}

/* ---------- backup / restore ---------- */
function mergeLog(incoming) {
  var cur = readLog(), added = 0;
  for (var id in incoming) {
    if (!incoming.hasOwnProperty(id)) { continue; }
    if (!cur[id]) { cur[id] = []; }
    var seen = {};
    for (var a = 0; a < cur[id].length; a++) { seen[cur[id][a].d + "|" + cur[id][a].r] = 1; }
    for (var b = 0; b < incoming[id].length; b++) {
      var e = incoming[id][b];
      if (!e || !e.d) { continue; }
      var key = e.d + "|" + e.r;
      if (!seen[key]) { cur[id].push({ d: e.d, r: e.r }); seen[key] = 1; added++; }
    }
    cur[id].sort(function (x, y) { return x.d < y.d ? -1 : 1; });
  }
  return writeLog(cur) ? added : -1;
}

d("showbackup").onclick = function () {
  var box = d("backupbox");
  box.style.display = "block";
  box.value = JSON.stringify(readLog());
  box.focus(); box.select();
  d("backupmsg").textContent = "Copy this somewhere safe \u2014 a note, an email to yourself.";
};

d("showrestore").onclick = function () {
  d("restorewrap").style.display = "block";
  d("restorebox").focus();
};

d("dorestore").onclick = function () {
  var txt = d("restorebox").value.trim();
  if (!txt) { d("backupmsg").textContent = "Paste a backup code first."; return; }
  var parsed;
  try { parsed = JSON.parse(txt); }
  catch (e) { d("backupmsg").textContent = "That isn't a valid backup code."; return; }
  if (!parsed || typeof parsed !== "object" || Array.isArray(parsed)) {
    d("backupmsg").textContent = "That isn't a valid backup code."; return;
  }
  var n = mergeLog(parsed);
  if (n < 0) { d("backupmsg").textContent = "Couldn't save \u2014 storage is blocked in this browser."; return; }
  d("backupmsg").textContent = n === 0 ? "Nothing new to add \u2014 already up to date." : "Restored " + n + " entr" + (n === 1 ? "y" : "ies") + ".";
  d("restorebox").value = "";
  buildPicker(); d("picker").value = S.id; renderHistory();
};

var rateBtns = document.querySelectorAll("#rate button");
for (var b = 0; b < rateBtns.length; b++) {
  rateBtns[b].onclick = function () {
    var rpe = parseInt(this.getAttribute("data-r"), 10);
    var saved = addEntry(S.id, rpe);
    d("rate").innerHTML = saved
      ? '<div class="saved">Logged.</div>'
      : '<div class="saved warn">Couldn\'t save on this phone \u2014 sending to the server instead.</div>';
    buildPicker();
    d("picker").value = S.id;
    renderHistory();
    syncNow(true);
  };
}

d("resync").onclick = function () { syncNow(); };

buildPicker();
renderHistory();
load(SESSIONS[0].id);
syncNow();
window.addEventListener("online", function () { syncNow(true); });
document.addEventListener("visibilitychange", function () {
  if (document.visibilityState === "visible" && !on) { syncNow(true); }
});

</script>
